<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#0f1116" media="(prefers-color-scheme: dark)" />
	<title>free.food · free food at the world's top universities</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous" />
	<link rel="stylesheet" href="app.css" />
</head>
<body>
	<header class="top">
		<a class="logo" href="#/" aria-label="free.food, home">
			<span class="badge" aria-hidden="true">🍕</span>
			<span class="words"><b>free.food</b><small>70 top campuses · fed daily</small></span>
		</a>
		<nav class="tabs" aria-label="Sections">
			<a href="#/" data-tab="events"><i data-lucide="calendar-heart"></i><span>Events</span></a>
			<a href="#/campuses" data-tab="campuses"><i data-lucide="school"></i><span>Campuses</span></a>
			<a href="#/saved" data-tab="saved"><i data-lucide="heart"></i><span>Saved</span></a>
		</nav>
		<label class="search">
			<i data-lucide="search"></i>
			<input id="q" type="search" placeholder="Search pizza, boba, a building or a club" autocomplete="off" />
		</label>
		<div class="right">
			<a class="live" id="live" href="#/campuses" title="Every campus and its live sources"><span class="dot"></span><span id="liveText">Connecting…</span></a>
			<a class="where" id="where" href="#/" hidden title="Show free food near you"><i data-lucide="map-pin"></i><span id="whereText">Near you</span></a>
		</div>
	</header>
	<div id="crumb" class="crumb" hidden></div>
	<div id="banner" class="banner" hidden></div>
	<main id="view" tabindex="-1"></main>
	<nav class="tabbar" aria-label="Sections">
		<a href="#/" data-tab="events"><i data-lucide="home"></i><span>Home</span></a>
		<a href="#/map" data-tab="map"><i data-lucide="map"></i><span>Map</span></a>
		<a href="#/saved" data-tab="saved"><i data-lucide="heart"></i><span>Saved</span></a>
		<a href="#/campuses" data-tab="campuses"><i data-lucide="trophy"></i><span>Campuses</span></a>
	</nav>
	<div id="toast" class="toast" hidden role="status"></div>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
	<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM" crossorigin="anonymous"></script>
	<script src="js/app.js" type="module"></script>
</body>
</html>
