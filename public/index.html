<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#0c0e11" media="(prefers-color-scheme: dark)" />
	<title>Free Food Hub · free food at the world's top universities</title>
	<script src="decks-canvas.js"></script>
	<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
	<link rel="stylesheet" href="app.css" />
</head>
<body>
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></symbol>
		<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 4v7h-7" /></symbol>
		<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z" /><circle cx="12" cy="9" r="2.5" /></symbol>
		<symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2-8-8-2z" /></symbol>
		<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2" /><path d="M3.5 10h17M8 3v4M16 3v4" /></symbol>
		<symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></symbol>
		<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
		<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
		<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" /></symbol>
		<symbol id="i-map" viewBox="0 0 24 24"><path d="m9 4-5 2v14l5-2 6 2 5-2V4l-5 2-6-2zM9 4v14M15 6v14" /></symbol>
		<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" /></symbol>
		<symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" /><circle cx="12" cy="12" r="7" /></symbol>
		<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></symbol>
		<symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8" /><path d="m9 21 2.5-7.5L14 16v5M7 11l3-4.5 4 1 2 3.5M11.5 13.5l1.2-5.7" /></symbol>
		<symbol id="i-bike" viewBox="0 0 24 24"><circle cx="5.5" cy="16.5" r="3.5" /><circle cx="18.5" cy="16.5" r="3.5" /><path d="M5.5 16.5 9 9h6l3.5 7.5M9 9l3 7.5H5.5M14 5h2.5L15 9" /></symbol>
		<symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16v-5l2-5h10l2 5v5M3 16h18v3h-3v-1H6v1H3zM5 11h14" /></symbol>
		<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
		<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 11v5M12 8h.01" /></symbol>
	</svg>

	<header class="bar">
		<a class="logo" href="./" aria-label="Free Food Hub home">
			<span class="mark" aria-hidden="true">🍕</span>
			<span class="word"><b>Free Food Hub</b><small>Top 70 universities</small></span>
		</a>
		<label class="search">
			<svg class="ic"><use href="#i-search" /></svg>
			<input id="q" type="search" placeholder="Search pizza, boba, a building or a club" autocomplete="off" />
			<kbd>/</kbd>
		</label>
		<div class="health">
			<button id="healthBtn" class="pill" title="See every source and its last check">
				<span class="dot" id="healthDot"></span><span id="healthText">Connecting…</span>
			</button>
			<button id="refresh" class="icon-btn" title="Check every feed again now" aria-label="Check every feed again now"><svg class="ic"><use href="#i-refresh" /></svg></button>
		</div>
	</header>

	<div class="banner" id="banner" hidden></div>

	<div class="layout" id="layout" data-tab="list">
		<aside class="side">
			<div class="side-scroll" id="sideScroll">
				<section class="quick" id="quick" aria-label="How many events have free food">
					<button data-when="now"><span class="k">Next 6 hours</span><b id="nNow">–</b></button>
					<button data-when="today"><span class="k">Today</span><b id="nToday">–</b></button>
					<button data-when="week"><span class="k">This week</span><b id="nWeek">–</b></button>
				</section>

				<section class="controls">
					<div class="seg" id="when" role="group" aria-label="When">
						<button data-v="now">Soon</button><button data-v="today">Today</button><button data-v="tomorrow">Tomorrow</button><button data-v="week">7 days</button><button data-v="all">3 weeks</button>
					</div>
					<div class="row">
						<div class="seg" id="food" role="group" aria-label="Which events">
							<button data-v="sure" title="Only events that say food is provided"><svg class="ic"><use href="#i-check" /></svg>Food confirmed</button><button data-v="likely" title="Also events that only mention food">+ Likely</button><button data-v="all" title="Every event, with or without food">All events</button>
						</div>
					</div>
					<div class="row two">
						<select id="region" aria-label="Region"><option value="all">All regions</option><option value="US">United States</option><option value="world">Rest of the world</option></select>
						<select id="uni" aria-label="University"><option value="">Every university</option></select>
					</div>
				</section>

				<div class="list-head">
					<span id="count" class="count"></span>
					<button id="feedChip" class="chip feed-chip" hidden title="Stop filtering by feed"><span></span><svg class="ic"><use href="#i-x" /></svg></button>
					<button id="near" class="chip"><svg class="ic"><use href="#i-locate" /></svg><span>Nearest first</span></button>
				</div>

				<div class="list" id="list" aria-live="polite"></div>
			</div>

			<section class="detail" id="detail" hidden aria-label="Event details"></section>
		</aside>

		<main class="mapwrap">
			<div id="map" aria-label="Map of events"></div>
			<div class="legend"><span><i class="lg sure"></i>Food confirmed</span><span><i class="lg likely"></i>Likely</span><span><i class="lg approx"></i>Campus centre</span></div>
			<button class="locate-btn icon-btn" id="locateBtn" title="Show where I am" aria-label="Show where I am"><svg class="ic"><use href="#i-locate" /></svg></button>
			<div id="route" class="route" hidden></div>
			<div id="toast" class="toast" hidden role="status"></div>
		</main>
	</div>

	<div class="scrim" id="scrim" hidden></div>
	<section class="sources" id="sources" hidden aria-label="Sources">
		<header>
			<div><h2>Sources</h2><p id="srcSummary"></p></div>
			<div class="src-head-actions">
				<button class="admin-toggle" id="adminToggle" aria-pressed="false" title="Show every feed's URL, type and status, and where each event came from"><span class="sw"></span>Admin</button>
				<button class="icon-btn" id="srcClose" aria-label="Close"><svg class="ic"><use href="#i-x" /></svg></button>
			</div>
		</header>
		<div class="src-tools">
			<div class="seg" id="srcFilter" role="group" aria-label="Filter sources"><button data-v="all" class="on">All</button><button data-v="issues">Issues</button><button data-v="none">No feed</button></div>
			<div class="src-kinds" id="srcKinds" hidden></div>
			<p class="src-note"><svg class="ic"><use href="#i-info" /></svg>Every feed is an open calendar the university publishes. It is read again every 3 hours.</p>
		</div>
		<div class="src-list" id="srcList"></div>
	</section>

	<nav class="tabbar" aria-label="Views">
		<button data-v="list" class="on"><svg class="ic"><use href="#i-list" /></svg>Events</button>
		<button data-v="map"><svg class="ic"><use href="#i-map" /></svg>Map</button>
		<button data-v="sources"><svg class="ic"><use href="#i-db" /></svg>Sources</button>
	</nav>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
	<script src="app.js" type="module"></script>
</body>
</html>
