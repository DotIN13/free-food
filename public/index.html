<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>free.food — free food at the world's top universities</title>
	<script src="decks-canvas.js"></script>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
	<link rel="stylesheet" href="app.css" />
</head>
<body>
	<header class="top">
		<div class="brand"><span class="logo">🍕</span><b>free.food</b><span class="slash">//</span><span class="tag">campus event hub</span></div>
		<input id="q" type="search" placeholder="Search pizza, boba, a building, a club…" autocomplete="off" />
		<div class="status"><span id="stat"></span><button id="refresh" class="ghost" title="Scrape every feed again">↻ Scrape</button></div>
	</header>

	<nav class="filters">
		<div class="seg" id="when" role="group" aria-label="When">
			<button data-v="now">Now &amp; next 6h</button><button data-v="today">Today</button><button data-v="tomorrow">Tomorrow</button><button data-v="week" class="on">7 days</button><button data-v="all">3 weeks</button>
		</div>
		<div class="seg" id="food" role="group" aria-label="Food">
			<button data-v="sure" class="on">🍕 Food provided</button><button data-v="likely">+ Likely</button><button data-v="all">All events</button>
		</div>
		<div class="seg" id="region" role="group" aria-label="Region">
			<button data-v="all" class="on">🌍 All</button><button data-v="US">US</button><button data-v="world">World</button>
		</div>
		<select id="uni" aria-label="University"><option value="">Every university</option></select>
		<button id="near" class="ghost">📍 Near me</button>
	</nav>

	<div class="tabs-mobile"><button data-v="list" class="on">List</button><button data-v="map">Map</button><button data-v="sources">Sources</button></div>

	<main>
		<section id="listPane" class="pane">
			<div class="pane-head"><span id="count"></span><div class="mini-tabs"><button id="showList" class="on">Events</button><button id="showSources">Sources</button></div></div>
			<div id="list" class="list"></div>
			<div id="sources" class="list" hidden></div>
		</section>
		<section id="mapPane" class="pane">
			<div id="map"></div>
			<div id="route" class="route" hidden></div>
			<div id="hint" class="hint" hidden></div>
		</section>
	</main>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
	<script src="app.js" type="module"></script>
</body>
</html>
